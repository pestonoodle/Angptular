<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paperino suono</title>
  <style>
    body {
      text-align: center;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #f0f0f0;
    }

    button {
      padding: 20px 40px;
      font-size: 20px;
      cursor: pointer;
      background-color: #ffcc00;
      border: none;
      border-radius: 10px;
      transition: background-color 0.3s;
    }

    button:hover {
      background-color: #ff9900;
    }

    .rotating-image {
      width: 162px; /* Puoi personalizzare la dimensione */
      height: auto;
      animation: rotate 4s linear infinite; /* Aggiungi l'animazione di rotazione infinita */
    }

    @keyframes rotate {
      from {
        transform: rotate(0deg); /* Inizia da 0 gradi */
      }
      to {
        transform: rotate(360deg); /* Completa una rotazione di 360 gradi */
      }
    }
  </style>



</head>
<body>
<img src="https://www.rossellafumia.it/wp-content/uploads/2016/04/paperino-arrabbiato.jpeg">
<button id="quackButton">Clicca per Quack</button>

<audio id="quack-sound">
  <source src="quack_5.mp3" type="audio/mpeg">

</audio>

<script>
  const quackButton = document.getElementById('quackButton');
  const quackSound = document.getElementById('quack-sound');

  quackButton.addEventListener('click', () => {
    quackSound.play();
  });
</script>

<div style="text-align: center; margin-top: 50px;">
  <!-- Link al sito della Polizia Postale -->
  <a href="https://www.commissariatodips.it/" target="_blank" title="Vai al sito della Polizia Postale">
    <!-- Immagine di Pippo -->
    <img class="rotating-image" src="https://it.wikifur.com/w/images/thumb/e/e5/Goofy.png/162px-Goofy.png">
  </a>
</div>


</body>
</html>
